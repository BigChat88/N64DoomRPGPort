name: release

# A push to the main branch -- a direct commit or a merged pull request, both
# land as a push -- builds the engine + host tools and publishes a GitHub
# Release whose asset is a self-contained "everything you need to build a ROM"
# archive.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest

    steps:
      - name: Install packaging deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends zip rsync gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # The mips64-elf toolchain image is built here from the pinned
      # submodule's Dockerfile instead of pulled: upstream's prebuilt image
      # (ghcr.io/dragonminded/libdragon) went away when libdragon moved to
      # n64brew, and the new one is not public.  The GCC build is slow, so it
      # is cached in GitHub Actions and only reruns when the submodule's
      # Dockerfile / build-toolchain.sh change.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the libdragon toolchain image
        uses: docker/build-push-action@v6
        with:
          context: core/libdragon
          load: true
          tags: libdragon-toolchain:ci
          cache-from: type=gha,scope=libdragon-toolchain
          cache-to: type=gha,scope=libdragon-toolchain,mode=max

      - name: Version
        id: ver
        run: |
          VER="$(tr -d ' \r\n' < VERSION)"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER"    >> "$GITHUB_OUTPUT"

      - name: Build libdragon (pinned submodule) + engine
        run: |
          docker run --rm -v "$PWD":/src -w /src libdragon-toolchain:ci bash -euc '
            git config --global --add safe.directory "*"
            make -C core/libdragon -j"$(nproc)" install
            # The library `install` target does NOT build the host tools.  The
            # `engine` target below runs n64sym + n64elfcompress, so build and
            # install those from the pinned submodule into $N64_INST/bin.
            make -C core/libdragon/tools -j"$(nproc)" n64sym-install n64elfcompress-install
            make -C core          -j"$(nproc)" engine
          '
          ls -l core/build/doomrpg.elf.stripped core/build/doomrpg.elf.sym

      - name: Cross-compile the Windows host tools
        run: |
          CC=x86_64-w64-mingw32-gcc bash app/vendor/bin/build-tools.sh
          ls -l app/vendor/bin/*.exe

      - name: Stage the bundle
        id: stage
        run: |
          set -eu
          NAME="N64DoomRPGPort-${{ steps.ver.outputs.version }}"
          DEST="stage/$NAME"
          mkdir -p "$DEST"
          # exactly the tracked source (git-ignored copyrighted data is excluded
          # by definition), including the libdragon submodule
          git ls-files --recurse-submodules -z | rsync -a --files-from=- --from0 ./ "$DEST/"
          # the CI-built binaries the packer needs
          mkdir -p "$DEST/app/vendor/engine"
          cp core/build/doomrpg.elf.stripped core/build/doomrpg.elf.sym "$DEST/app/vendor/engine/"
          cp app/vendor/bin/*.exe "$DEST/app/vendor/bin/"
          # provenance
          {
            echo "N64DoomRPGPort ${{ steps.ver.outputs.version }}"
            echo "commit:  ${GITHUB_SHA}"
            echo "ref:     ${GITHUB_REF}"
            echo "run:     ${GITHUB_RUN_NUMBER}"
            echo "built:   $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$DEST/BUILD_INFO.txt"
          ( cd stage && zip -qr "../$NAME.zip" "$NAME" )
          ls -l "$NAME.zip"
          echo "asset=$NAME.zip" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: N64DoomRPGPort ${{ steps.ver.outputs.version }}
          prerelease: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: ${{ steps.stage.outputs.asset }}
